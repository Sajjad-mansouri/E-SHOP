  
<div class="breadcrumb-wrapper">
  <div class="breadcrumb">
  <a href="{%url 'catalog:home'%}">Home</a>
  <span>/</span>
{%for cat in breadcrumb%}
  <a href="{%url 'catalog:category' cat.slug%}">{{cat.name}}</a>
  {% if not forloop.last %}
  <span>/</span>
  {%endif%}
  {%endfor%}
  {%if product%}
  <span>/</span>
  <a href="">{{product.title}}</a>
  {%endif%}
</div>
</div>
