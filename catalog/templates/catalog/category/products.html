{%extends 'base.html'%}
{%load static catalog_tags%}

{%block style%}
<link rel="stylesheet" type="text/css" href="{%static 'css/category_products.css'%}">
{%endblock%}
{%block content%}
<!-- BREADCRUMB -->
{% get_product_breadcrumb '' category%}
<!-- MAIN CONTENT -->
<div class="category-container">
  <!-- FILTER SIDEBAR -->
  {%include 'catalog/category/_filter.html'%}

  
  <!-- PRODUCTS SECTION -->
  <main class="products-section">

    

      {%include 'catalog/category/_products.html'%}

    

  </main>
</div>

{%endblock%}


{%block script%}
<script>
  // Complete product data


  // State management
  let currentPage = 1;
  const productsPerPage = 8;

  let sortBy = 'featured';
  const filters = {}
  // Filter state
  document.querySelectorAll('.filter-title').forEach(el => {
      const key = el.dataset.filter;  // reads data-filter="something"
      filters[key] = [];               // or some default value
  });
  filters["price"] = { min: 0, max: 10000000 };

  // DOM Elements
  const productsSection = document.querySelector(".products-section");

  const productsContainer = document.getElementById('productsContainer');
  const productCount = document.getElementById('productCount');
  const sortSelect = document.getElementById('sortSelect');
  const clearFiltersBtn = document.getElementById('clearFilters');
  const prevPageBtn = document.getElementById('prevPage');
  const nextPageBtn = document.getElementById('nextPage');
  const pageBtns = document.querySelectorAll('.page-btn:not(.arrow)');
  const applyFilterBtn = document.getElementById("applyFiltersBtn");

  // Price slider elements
  const priceMinInput = document.getElementById('priceMin');
  const priceMaxInput = document.getElementById('priceMax');
  const priceMinHandle = document.getElementById('priceMinHandle');
  const priceMaxHandle = document.getElementById('priceMaxHandle');
  const priceTrack = document.getElementById('priceTrack');
  const priceMinValue = document.getElementById('priceMinValue');
  const priceMaxValue = document.getElementById('priceMaxValue');
  const priceSlider = document.getElementById('priceSlider');

  // Initialize
  document.addEventListener('DOMContentLoaded', () => {
    initFilters();
    initPriceSlider();


  });


  // Initialize filter toggles
  function initFilters() {
    // Filter section toggles
    document.querySelectorAll('.filter-title').forEach(title => {
      title.addEventListener('click', () => {
        const filterId = title.getAttribute('data-filter');
        const content = document.getElementById(`${filterId}Filter`);
        const toggle = title.querySelector('.filter-toggle');
        
        content.classList.toggle('expanded');
        toggle.classList.toggle('rotated');
      });
    });

    // Filter checkbox toggles
    document.querySelectorAll('.filter-option').forEach(option => {
      option.addEventListener('click', () => {
        const checkbox = option.querySelector('.filter-checkbox');
        checkbox.classList.toggle('checked');
        
        const filterType = option.closest('.filter-content').id.replace('Filter', '');
        const value = option.getAttribute('data-value');
        
        if (checkbox.classList.contains('checked')) {
          if (!filters[filterType].includes(value)) {
            filters[filterType].push(value);
          }

        } else {
          const index = filters[filterType].indexOf(value);

          if (index > -1) {
            filters[filterType].splice(index, 1);
          }
        }

        

      });
    });

    // Clear filters button
    clearFiltersBtn.addEventListener('click', () => {
      clearAllFilters();
    });

    // Sort select
    sortSelect.addEventListener('change', (e) => {
      sortBy = e.target.value;

    });

    // Pagination buttons
    prevPageBtn.addEventListener('click', () => {
      if (currentPage > 1) {
        currentPage--;
        renderProducts();
        updatePagination();
      }
    });

    nextPageBtn.addEventListener('click', () => {
      const totalPages = Math.ceil(filteredProducts.length / productsPerPage);
      if (currentPage < totalPages) {
        currentPage++;
        renderProducts();
        updatePagination();
      }
    });

    // Page number buttons
    pageBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        if (!btn.classList.contains('active')) {
          currentPage = parseInt(btn.textContent);
          renderProducts();
          updatePagination();
        }
      });
    });

    applyFilterBtn.addEventListener("click", ()=>{
      applyFilters()
    })
  }

  // Initialize price slider
  function initPriceSlider() {
    let isDraggingMin = false;
    let isDraggingMax = false;
    const sliderRect = priceSlider.getBoundingClientRect();
    const sliderWidth = sliderRect.width;
    const minPrice = 0;
    const maxPrice = 10000000;
    
    // Update slider position
    function updateSlider() {
      const minPercent = (filters.price.min - minPrice) / (maxPrice - minPrice) * 100;
      const maxPercent = (filters.price.max - minPrice) / (maxPrice - minPrice) * 100;
      
      priceMinHandle.style.left = `${minPercent}%`;
      priceMaxHandle.style.left = `${maxPercent}%`;
      priceTrack.style.left = `${minPercent}%`;
      priceTrack.style.width = `${maxPercent - minPercent}%`;
      
      priceMinInput.value = filters.price.min;
      priceMaxInput.value = filters.price.max;
      priceMinValue.textContent = filters.price.min;
      priceMaxValue.textContent = filters.price.max;
    }
    
    // Set initial position
    updateSlider();
    
    // Handle mouse events for min handle
    priceMinHandle.addEventListener('mousedown', (e) => {
      isDraggingMin = true;
      document.addEventListener('mousemove', handleMinDrag);
      document.addEventListener('mouseup', () => {
        isDraggingMin = false;
        document.removeEventListener('mousemove', handleMinDrag);
      });
    });
    
    // Handle mouse events for max handle
    priceMaxHandle.addEventListener('mousedown', (e) => {
      isDraggingMax = true;
      document.addEventListener('mousemove', handleMaxDrag);
      document.addEventListener('mouseup', () => {
        isDraggingMax = false;
        document.removeEventListener('mousemove', handleMaxDrag);
      });
    });
    
    // Handle min handle drag
    function handleMinDrag(e) {
      if (!isDraggingMin) return;
      
      const rect = priceSlider.getBoundingClientRect();
      let x = e.clientX - rect.left;
      x = Math.max(0, Math.min(x, rect.width));
      
      const percent = (x / rect.width) * 100;
      const newPrice = Math.round((percent / 100) * (maxPrice - minPrice) + minPrice);
      
      if (newPrice < filters.price.max - 50) {
        filters.price.min = newPrice;
        updateSlider();
      }
    }
    
    // Handle max handle drag
    function handleMaxDrag(e) {
      if (!isDraggingMax) return;
      
      const rect = priceSlider.getBoundingClientRect();
      let x = e.clientX - rect.left;
      x = Math.max(0, Math.min(x, rect.width));
      
      const percent = (x / rect.width) * 100;
      const newPrice = Math.round((percent / 100) * (maxPrice - minPrice) + minPrice);
      
      if (newPrice > filters.price.min + 50) {
        filters.price.max = newPrice;
        updateSlider();

      }
    }
    
    // Input change events
    priceMinInput.addEventListener('change', () => {
      let value = parseInt(priceMinInput.value);
      if (isNaN(value)) value = minPrice;
      value = Math.max(minPrice, Math.min(value, filters.price.max - 50));
      filters.price.min = value;
      updateSlider();

    });
    
    priceMaxInput.addEventListener('change', () => {
      let value = parseInt(priceMaxInput.value);
      if (isNaN(value)) value = maxPrice;
      value = Math.min(maxPrice, Math.max(value, filters.price.min + 50));
      filters.price.max = value;
      updateSlider();

    });
  }

  // Apply all filters and sorting
  async function applyFilters() {
    const data = await getFetch()
    productsSection.innerHTML = ""
    productsSection.innerHTML = data

  }
  function serializeFiltersToURL() {
    console.log("serializeFiltersToURL")
    const params = new URLSearchParams();
    for (const [key, value] of Object.entries(filters)) {
      if(Array.isArray(value)){
        value.forEach(v => params.append(key, v));
      }
      else if(typeof value === "object" && value !==null){
        Object.entries(value).forEach(([subKey, subValue]) => {
          params.append(`${key}_${subKey}`, subValue);
        });
      }
      else{
         params.append(key, value);
      }

    }
    const newURL = `${params.toString()}`;
    return newURL
  }
  async function getFetch(){
    const url = serializeFiltersToURL()
    const response = await fetch("{%url 'catalog:category_product_filter' category.product_class.id %}" + `?${url}`,{
      method:"GET"
    })
    const data = await response.text()
    return data
  }



  // Clear all filters
  function clearAllFilters() {
    // Reset filter state
    Object.entries(filters).forEach(([key, value])=>{
      if (key=="price"){

        filters.price = { min: 0, max: 10000000 };
      }else{
        filters[key]=[]
      }
    })
    
    filters.brand = [];
    filters.type = [];
    filters.rating = [];

    // Reset UI checkboxes
    document.querySelectorAll('.filter-checkbox').forEach(checkbox => {
      checkbox.classList.remove('checked');
    });
    
    // Check "In Stock" by default
    document.querySelector('.filter-option[data-value="in-stock"] .filter-checkbox').classList.add('checked');
    
    // Reset price slider
    priceMinInput.value = 0;
    priceMaxInput.value = 5000;
    initPriceSlider();
    
    // Reset sort
    sortSelect.value = 'featured';
    sortBy = 'featured';
    
    // Apply filters

  }

  // Render products to the grid
  function renderProducts() {
    const startIndex = (currentPage - 1) * productsPerPage;
    const endIndex = startIndex + productsPerPage;
    const productsToShow = filteredProducts.slice(startIndex, endIndex);
    
    productsContainer.innerHTML = '';
    
    productsToShow.forEach(product => {
      const productCard = createProductCard(product);
      productsContainer.appendChild(productCard);
    });
    

  }




</script>
{%endblock%}
