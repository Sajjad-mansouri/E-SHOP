{%load static%}
<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{%block title%} {%endblock%}</title>
<link rel="stylesheet" type="text/css" href="{%static 'css/profile/base.css'%}">
{%block style%}

{%endblock%}
</head>
<body>
<header class="header">
  <a href="/" class="logo-text">E-<span>SHOP</span></a>
  <a href="/" class="home-link">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M19 12H5"></path>
      <path d="M12 19l-7-7 7-7"></path>
    </svg>
    Return to Home
  </a>
</header>
<!-- ACCOUNT PAGE LAYOUT -->
<div class="account-wrapper">

  <!-- sidebar -->
  <div class="account-sidebar">
    <h3>My Account</h3>
    <div class="account-menu">
      <a href="{%url 'account:profile'%}" class="active">Profile</a>
      <a href="{%url 'account:order_history'%}">Order History</a>
      <a href="{%url 'account:addresses'%}">Address Book</a>
      <a href="{%url 'account:wishlist'%}">Wish Lists</a>

    </div>
  </div>

  <!-- content -->
  {%block content%}

  {%endblock%}

</div>

{%block extra%}
{%endblock%}

{%block script%}

{%endblock%}
</body>
</html>
