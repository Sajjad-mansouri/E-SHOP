{%load static%}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Your E-commerce Store</title>
    <!-- Removed Font Awesome Link -->
    <link rel="stylesheet" type="text/css" href="{%static 'css/registration/base_registration.css'%}">
    {%block style%}
    {%endblock%}
</head>
<body>
    <!-- Header -->
    <header class="header">
        <a href="/" class="logo">
            <div class="logo-text">E-<span>SHOP</span></div>
        </a>
        <a href="{%url 'catalog:home'%}" class="home-link">
            <svg class="icon" viewBox="0 0 24 24"><path d="M19 12H5m7-7-7 7 7 7"/></svg>
            <span>Return to Home</span>
        </a>
    </header>

    <!-- Main Content -->
    <main class="main-content">
        {%block content%}
        {%endblock%}
    </main>

    <footer class="footer">
        <div class="footer-links">
            <a href="#" class="footer-link">About Us</a>
            <a href="#" class="footer-link">Privacy Policy</a>
            <a href="#" class="footer-link">Help Center</a>
        </div>
        <p class="copyright">&copy; 2026 E-SHOP. All rights reserved.</p>
    </footer>


    {%block script%}

    {%endblock%}
</body>
</html>
