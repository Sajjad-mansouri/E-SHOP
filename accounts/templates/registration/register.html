{%extends 'base.html'%}
{% load static %}

  {%block style%}
  <link rel="stylesheet" type="text/css" href="{% static 'css/register.css'%}">

  {%endblock%}

{%block content%}

<!-- ========== REGISTRATION SECTION ========== -->
<div class="reg-section">
  <div class="reg-card">
    <div class="reg-header">
      <h1><i class="fa-regular fa-pen-to-square"></i> Create Customer account</h1>
      <p>Join E‑SHOP for faster checkout, exclusive deals, and order tracking</p>
    </div>

    <form class="reg-form" method="POST">
      {%csrf_token%}
      <!-- row: first / last name -->
      <div class="form-row">
        <div class="form-group">
          <label><i class="fa-regular fa-user"></i> First name</label>
          <input type="text" placeholder="Alex" required name="first_name">
        </div>
        <div class="form-group">
          <label><i class="fa-regular fa-user"></i> Last name</label>
          <input type="text" placeholder="Johnson" required name="last_name">
        </div>
      </div>

      <!-- email -->
      <div class="form-group">
        <label><i class="fa-regular fa-envelope"></i> Email address</label>
        <input type="email" placeholder="alex.johnson@example.com" required name="email">
      </div>



      <!-- password row with confirmation -->
      <div class="form-row">
        <div class="form-group">
          <label><i class="fa-regular fa-lock"></i> Password</label>
          <input type="password" placeholder="••••••••" required minlength="8" name="password1">
          <div class="password-hint">At least 8 characters, one number & one letter</div>
        </div>
        <div class="form-group">
          <label><i class="fa-regular fa-lock"></i> Confirm password</label>
          <input type="password" placeholder="••••••••" required name="password2">
        </div>
      </div>





      <!-- register button -->
      <button type="submit" class="reg-btn"><i class="fa-regular fa-user-plus"></i> Register now</button>

      <div class="login-link">
        Already have an account? <a href="#">Sign in</a>
      </div>
    </form>
  </div>
</div>

{%endblock%}
