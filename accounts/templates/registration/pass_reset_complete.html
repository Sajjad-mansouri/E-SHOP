{%extends 'registration/_base_registration.html'%}
{% load static %}

  {%block style%}
  <link rel="stylesheet" type="text/css" href="{% static 'css/registration/password_reset_completed.css'%}">

  {%endblock%}
  {%block content%}

        <div class="status-card">
            <div class="status-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
                    <polyline points="22 4 12 14.01 9 11.01"></polyline>
                </svg>
            </div>
            <h1>Password Changed!</h1>
            <p>Your password has been successfully reset. You can now use your new password to log in to your account.</p>

            <a href="{%url 'account:login'%}" class="btn btn-primary">Log In Now</a>
        </div>

{%endblock%}
