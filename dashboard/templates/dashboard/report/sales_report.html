{%extends 'dashboard/_dashboard_base.html'%}
{%load static%}
{%block title%}Report{%endblock%}
{%block style%}
<link rel="stylesheet" type="text/css" href="{%static 'css/dashboard/report/sales_report.css'%}">
{%endblock%}

{%block content%}
	<div id="messageBox" class="message"></div>
<main class="main">

	<div class="page-header">
	<div class="page-title">Sales Report</div>

	<div class="filter">
	<input type="date" class="start-range">
	<input type="date" class="end-range">
	<button id="apply-range">Filter</button>
	</div>

	</div>

	<!-- SALES STATS -->
<div id="content">

	{%include 'dashboard/report/_report.html'%}
</div>



</main>
{%endblock%}

{%block extra%}

{%endblock%}

{%block script%}
<script>
const applyRangeBtn = document.getElementById("apply-range");
const content = document.getElementById("content")
 applyRangeBtn.addEventListener("click", async ()=>{
 	const timezone = Intl.DateTimeFormat().resolvedOptions().timeZone;

	const startRange = document.querySelector(".start-range").value;
	const endRange = document.querySelector(".end-range").value;
	if(startRange==""){

		showMessage("Please select start and end of range!", "error")
	}
	else{
		const url = "{%url 'dashboard:sales_report'%}" + `?filter=true&is_range=true&range_start=${startRange}&range_end=${endRange}&timezone=${timezone}`
		const data = await filterByPeriood(url)
		updateTemplate(data)
		showMessage(`results from:${startRange} to:${endRange}`, "success")
	}


 })
function showMessage(text,type){

	const box=document.getElementById("messageBox")

	box.innerText=text
	box.className="message "+type
	box.style.display="block"

	setTimeout(()=>{
	box.style.display="none"
	},10000)

}

 async function filterByPeriood(url){
 	const response = await fetch(url, {
 		method:"GET",
 		headers:{
 			"AJAX":true
 		}
 	})
 	const data = await response.text()
 	return data
 }

  function updateTemplate(data){
		content.innerHTML = data;
	 }
</script>
{%endblock%}
