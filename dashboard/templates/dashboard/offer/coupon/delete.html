{%extends 'base.html'%}
{%load static%}
{%block style%}
<link rel="stylesheet" type="text/css" href="{%static 'css/create_update_offer.css'%}">
{%endblock%}

{%block content%}

<div class="breadcrumb-bar">
  <div class="breadcrumb">
    <a href="#">Dashboard</a> <i class="fa-solid fa-chevron-right"></i>
    <a href="#">Offers</a> <i class="fa-solid fa-chevron-right"></i>
    <span class="current">Delete Coupon</span>
  </div>
</div>

<main class="offer-container">
  <div class="offer-card">
    <h1><i class="fa-regular fa-tag"></i> Delete Coupon</h1>

    <form method="POST">
      Do you want to delete this Coupon ?
      {%csrf_token%}
      {{form}}
      <input type="submit" value="delete">
    </form>
        
  </div>
</main>

{%endblock%}
