
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Order Confirmed</title>

    <style>
        :root {
            --primary: #4f46e5;
            --primary-dark: #4338ca;

            --success: #10b981;
            --success-light: #d1fae5;
            --success-dark: #065f46;

            --gray-50: #f9fafb;
            --gray-100: #f3f4f6;
            --gray-200: #e5e7eb;
            --gray-400: #9ca3af;
            --gray-500: #6b7280;
            --gray-600: #4b5563;
            --gray-700: #374151;
            --gray-800: #1f2937;
            --gray-900: #111827;

            --white: #ffffff;

            --shadow-md:
                0 4px 6px -1px rgba(0, 0, 0, 0.1),
                0 2px 4px -1px rgba(0, 0, 0, 0.06);

            --shadow-lg:
                0 10px 15px -3px rgba(0, 0, 0, 0.1),
                0 4px 6px -2px rgba(0, 0, 0, 0.05);

            --shadow-xl:
                0 20px 25px -5px rgba(0, 0, 0, 0.1),
                0 10px 10px -5px rgba(0, 0, 0, 0.04);

            --radius-md: 10px;
            --radius-xl: 24px;
            --radius-full: 9999px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                "Helvetica Neue",
                Arial,
                sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #eef2ff 0%,
                    #f0fdf4 50%,
                    #ecfdf5 100%
                );

            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;

            position: relative;
            overflow: hidden;
        }

        body::before,
        body::after {
            content: "";
            position: absolute;
            border-radius: 50%;
            opacity: 0.3;
            pointer-events: none;
        }

        body::before {
            width: 400px;
            height: 400px;
            background: #a7f3d0;
            top: -100px;
            right: -100px;
            animation: float 6s ease-in-out infinite;
        }

        body::after {
            width: 350px;
            height: 350px;
            background: #c7d2fe;
            bottom: -80px;
            left: -80px;
            animation: float 8s ease-in-out infinite reverse;
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0) rotate(0deg);
            }

            50% {
                transform: translateY(-20px) rotate(5deg);
            }
        }

        .container {
            background: var(--white);
            border-radius: var(--radius-xl);
            box-shadow: var(--shadow-xl);

            padding: 48px 40px;

            max-width: 520px;
            width: 100%;

            text-align: center;

            position: relative;
            z-index: 1;

            animation:
                slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Success icon */

        .icon-wrapper {
            width: 100px;
            height: 100px;

            margin: 0 auto 24px;

            display: flex;
            align-items: center;
            justify-content: center;
        }

        .checkmark-circle {
            width: 100px;
            height: 100px;

            border-radius: 50%;

            background: var(--success);

            display: flex;
            align-items: center;
            justify-content: center;

            animation:
                scaleIn 0.4s cubic-bezier(0.16, 1, 0.3, 1)
                forwards;

            box-shadow:
                0 0 0 8px var(--success-light);
        }

        @keyframes scaleIn {
            from {
                opacity: 0;
                transform: scale(0.5);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .checkmark-svg {
            width: 50px;
            height: 50px;

            stroke: var(--white);
            stroke-width: 5;

            fill: none;

            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .checkmark-svg path {
            stroke-dasharray: 50;
            stroke-dashoffset: 50;

            animation:
                drawCheckmark 0.5s ease-out 0.3s
                forwards;
        }

        @keyframes drawCheckmark {
            to {
                stroke-dashoffset: 0;
            }
        }

        /* Heading */

        h1 {
            font-size: 28px;
            font-weight: 700;

            color: var(--gray-900);

            margin-bottom: 10px;

            letter-spacing: -0.5px;
        }

        .message {
            font-size: 16px;

            color: var(--gray-600);

            line-height: 1.6;

            margin-bottom: 28px;
        }

        .message strong {
            color: var(--success-dark);
            font-weight: 600;
        }

        /* Order information */

        .order-info {
            background: var(--gray-50);

            border: 1px solid var(--gray-200);

            border-radius: var(--radius-md);

            padding: 18px 20px;

            margin-bottom: 28px;

            text-align: left;
        }

        .order-info-row {
            display: flex;

            align-items: center;
            justify-content: space-between;

            gap: 16px;

            padding: 8px 0;
        }

        .order-info-row + .order-info-row {
            border-top: 1px solid var(--gray-200);
        }

        .order-label {
            font-size: 12px;

            text-transform: uppercase;

            letter-spacing: 0.8px;

            font-weight: 600;

            color: var(--gray-400);
        }

        .order-value {
            font-size: 14px;

            font-weight: 600;

            color: var(--gray-800);

            text-align: right;

            word-break: break-all;
        }

        .order-number {
            color: var(--primary);

            font-family:
                ui-monospace,
                SFMono-Regular,
                Menlo,
                Monaco,
                Consolas,
                monospace;
        }

        /* Buttons */

        .btn-group {
            display: flex;

            gap: 12px;

            flex-wrap: wrap;

            justify-content: center;
        }

        .btn {
            display: inline-flex;

            align-items: center;
            justify-content: center;

            gap: 8px;

            padding: 12px 24px;

            border-radius: var(--radius-full);

            font-size: 14px;

            font-weight: 600;

            text-decoration: none;

            cursor: pointer;

            transition:
                background 0.2s ease,
                border-color 0.2s ease,
                box-shadow 0.2s ease,
                transform 0.2s ease;

            border: none;

            letter-spacing: 0.2px;
        }

        .btn-primary {
            background: var(--primary);

            color: var(--white);

            box-shadow: var(--shadow-md);
        }

        .btn-primary:hover {
            background: var(--primary-dark);

            box-shadow: var(--shadow-lg);

            transform: translateY(-2px);
        }

        .btn-secondary {
            background: var(--white);

            color: var(--gray-700);

            border: 1px solid var(--gray-200);
        }

        .btn-secondary:hover {
            background: var(--gray-50);

            border-color: var(--gray-400);

            transform: translateY(-2px);
        }

        .btn svg {
            width: 18px;
            height: 18px;
        }

        /* Stripe session */

        .session-info {
            margin-top: 20px;

            font-size: 11px;

            color: var(--gray-400);

            word-break: break-all;
        }

        .session-info-label {
            display: block;

            margin-bottom: 4px;

            text-transform: uppercase;

            letter-spacing: 0.8px;

            font-weight: 600;
        }

        .session-id {
            color: var(--gray-500);
        }

        /* Confetti */

        .confetti {
            position: fixed;

            pointer-events: none;

            z-index: 0;

            animation:
                confettiFall linear forwards;
        }

        @keyframes confettiFall {
            0% {
                opacity: 1;
                transform:
                    translateY(-10px)
                    rotate(0deg);
            }

            100% {
                opacity: 0;
                transform:
                    translateY(100vh)
                    rotate(720deg);
            }
        }

        @media (max-width: 480px) {
            .container {
                padding: 32px 20px;
            }

            h1 {
                font-size: 23px;
            }

            .message {
                font-size: 14px;
            }

            .order-info-row {
                align-items: flex-start;

                flex-direction: column;

                gap: 4px;
            }

            .order-value {
                text-align: left;
            }

            .btn-group {
                flex-direction: column;
            }

            .btn {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <!-- Success icon -->

        <div class="icon-wrapper">
            <div class="checkmark-circle">

                <svg
                    class="checkmark-svg"
                    viewBox="0 0 52 52"
                    xmlns="http://www.w3.org/2000/svg"
                    aria-hidden="true"
                >
                    <path d="M14 27 L22 35 L38 19" />
                </svg>

            </div>
        </div>

        <h1>Payment Successful!</h1>

        <p class="message">
            Thank you for your purchase.
            Your <strong>order has been confirmed</strong>
            and is now being processed.
        </p>

        <!-- Order information -->

        <div class="order-info">

            <div class="order-info-row">

                <span class="order-label">
                    Order Number
                </span>

                <span
                    class="order-value order-number"
                    id="orderNumber"
                >
                    Loading...
                </span>

            </div>

            <div class="order-info-row">

                <span class="order-label">
                    Payment Status
                </span>

                <span
                    class="order-value"
                    id="paymentStatus"
                >
                    Paid
                </span>

            </div>

        </div>

        <div class="btn-group">

            <!-- Change these URLs to your actual ecommerce URLs -->

            <a
                href="/orders/"
                class="btn btn-primary"
            >
                <svg
                    xmlns="http://www.w3.org/2000/svg"
                    fill="none"
                    viewBox="0 0 24 24"
                    stroke="currentColor"
                    aria-hidden="true"
                >
                    <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        stroke-width="2"
                        d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"
                    />
                </svg>

                View My Orders
            </a>

            <a
                href="/products/"
                class="btn btn-secondary"
            >
                <svg
                    xmlns="http://www.w3.org/2000/svg"
                    fill="none"
                    viewBox="0 0 24 24"
                    stroke="currentColor"
                    aria-hidden="true"
                >
                    <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        stroke-width="2"
                        d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2 2h13m-13 0a2 2 0 104 0m9 0a2 2 0 104 0"
                    />
                </svg>

                Continue Shopping
            </a>

        </div>

        <!-- Optional technical Stripe information -->

        <div
            class="session-info"
            id="sessionInfo"
            hidden
        >
            <span class="session-info-label">
                Payment Reference
            </span>

            <span
                class="session-id"
                id="sessionIdText"
            ></span>
        </div>

    </div>

    <script>
        (function () {
            function getUrlParameter(name) {
                const params = new URLSearchParams(
                    window.location.search
                );

                return params.get(name);
            }

            function displayOrderInformation() {
                const orderNumber = getUrlParameter(
                    "order_number"
                );

                const sessionId = getUrlParameter(
                    "session_id"
                );

                const orderNumberElement =
                    document.getElementById("orderNumber");

                const sessionInfoElement =
                    document.getElementById("sessionInfo");

                const sessionIdElement =
                    document.getElementById("sessionIdText");

                if (orderNumber) {
                    orderNumberElement.textContent =
                        orderNumber;
                } else {
                    orderNumberElement.textContent =
                        "Available in your orders";
                }

                if (sessionId) {
                    sessionIdElement.textContent =
                        sessionId;

                    sessionInfoElement.hidden = false;
                }
            }

            function createConfetti() {
                const colors = [
                    "#10b981",
                    "#4f46e5",
                    "#f59e0b",
                    "#ef4444",
                    "#3b82f6",
                    "#8b5cf6",
                    "#ec4899",
                    "#14b8a6"
                ];

                for (let i = 0; i < 60; i++) {
                    const confetti =
                        document.createElement("div");

                    confetti.className = "confetti";

                    const color =
                        colors[
                            Math.floor(
                                Math.random() * colors.length
                            )
                        ];

                    const size =
                        Math.random() * 8 + 4;

                    const left =
                        Math.random() * 100;

                    const duration =
                        Math.random() * 2 + 2;

                    const delay =
                        Math.random() * 2;

                    confetti.style.left =
                        `${left}vw`;

                    confetti.style.width =
                        `${size}px`;

                    confetti.style.height =
                        `${size * 0.4}px`;

                    confetti.style.background =
                        color;

                    confetti.style.animationDuration =
                        `${duration}s`;

                    confetti.style.animationDelay =
                        `${delay}s`;

                    confetti.style.top = "-10px";

                    confetti.style.borderRadius = "2px";

                    document.body.appendChild(
                        confetti
                    );

                    setTimeout(() => {
                        confetti.remove();
                    }, (duration + delay) * 1000 + 100);
                }
            }

            document.addEventListener(
                "DOMContentLoaded",
                function () {
                    displayOrderInformation();
                    createConfetti();
                }
            );
        })();
    </script>

</body>
</html>
